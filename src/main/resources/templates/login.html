<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 · AI 블로그 도우미</title>
  <style th:replace="~{fragments/authstyle :: css}"></style>
</head>
<body>
<div class="box">
  <h1>✍️ AI 블로그 도우미</h1>
  <p class="sub">승인된 회원만 이용할 수 있어요</p>

  <div th:if="${param.error}" class="msg err">아이디 또는 비밀번호가 맞지 않아요.</div>
  <div th:if="${param.logout}" class="msg info">로그아웃했어요.</div>
  <div th:if="${param.kicked}" class="msg err">다른 곳에서 같은 아이디로 로그인해서 접속이 끊겼어요.</div>
  <div th:if="${param.signedUp}" class="msg ok">가입 신청이 완료됐어요!<br>관리자 승인 후 이용할 수 있어요. 로그인하면 진행 상태를 볼 수 있어요.</div>

  <form th:action="@{/login}" method="post">
    <label for="username">아이디</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" class="btn">로그인</button>
  </form>
  <p class="foot">처음이신가요? <a th:href="@{/signup}">가입 신청하기</a></p>
</div>
</body>
</html>
