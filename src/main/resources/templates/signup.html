<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>가입 신청 · AI 블로그 도우미</title>
  <style th:replace="~{fragments/authstyle :: css}"></style>
</head>
<body>
<div class="box">
  <h1>📝 가입 신청</h1>
  <p class="sub">신청 후 관리자가 결제를 확인하고 승인해 드려요</p>

  <div th:if="${errorMsg}" class="msg err" th:text="${errorMsg}"></div>

  <form th:action="@{/signup}" method="post">
    <label for="username">아이디</label>
    <input type="text" id="username" name="username" th:value="${username}" maxlength="20" required
           autocomplete="username" pattern="[a-zA-Z0-9_]{4,20}">
    <p class="hint">영문 소문자·숫자·_ 4~20자</p>

    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" minlength="8" maxlength="64" required autocomplete="new-password">
    <p class="hint">8자 이상</p>

    <label for="password2">비밀번호 확인</label>
    <input type="password" id="password2" name="password2" minlength="8" maxlength="64" required autocomplete="new-password">

    <label for="displayName">이름 또는 상호</label>
    <input type="text" id="displayName" name="displayName" th:value="${displayName}" maxlength="60" required>

    <label for="contact">크몽 닉네임</label>
    <input type="text" id="contact" name="contact" th:value="${contact}" maxlength="120" required>
    <p class="hint">결제하신 크몽 닉네임을 적어주세요. 결제 확인에 사용해요.</p>

    <button type="submit" class="btn">가입 신청</button>
  </form>
  <p class="foot">이미 계정이 있나요? <a th:href="@{/login}">로그인</a></p>
</div>
</body>
</html>
