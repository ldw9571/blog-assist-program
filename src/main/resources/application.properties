server.port=${PORT:8080}

# Google Gemini API 키 - 환경변수(GEMINI_API_KEY)에서 주입받음. 절대 여기 직접 값 넣지 말 것.
gemini.api.key=${GEMINI_API_KEY}
# 예비 키 (다른 구글 계정). 환경변수 GEMINI_API_KEY_2 가 없으면 사용 안 함
gemini.api.key2=${GEMINI_API_KEY_2:}

# ─────────────────────────────────────────
# 데이터 저장 위치 (회원 DB + 분양 자료)
#  서버에 올릴 때는 DATA_DIR 을 '유지되는 디스크(볼륨)' 경로로 지정할 것. 예) /data
# ─────────────────────────────────────────
app.data-dir=${DATA_DIR:.}
estate.data-dir=${app.data-dir}/estate-data
spring.datasource.url=jdbc:h2:file:${app.data-dir}/db/blogai;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ─────────────────────────────────────────
# 관리자 계정 (처음 실행할 때 관리자가 없으면 이 값으로 만들어짐)
# ─────────────────────────────────────────
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
# 새로 승인하는 회원의 기본 하루 사용 한도
app.default-daily-limit=${DEFAULT_DAILY_LIMIT:30}
# 비상용: true 로 두면 IP 제한을 무시 (관리자 IP가 바뀌어 못 들어갈 때)
app.ip-filter.force-off=${IP_FILTER_FORCE_OFF:false}

# 클라우드 호스팅(프록시) 뒤에서 실제 접속자 IP를 읽기 위한 설정
server.forward-headers-strategy=native

# 로그인 유지 시간
server.servlet.session.timeout=12h

spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
# 분양 자료 PDF 업로드 한도
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
server.tomcat.max-http-form-post-size=20MB
