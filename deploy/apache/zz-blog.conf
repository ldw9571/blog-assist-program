# 블로그 도우미 → Apache 연결 설정
#  ⚠️ 파일 이름이 zz- 로 시작해야 해요. (기존 laravel.conf 가 계속 '기본 사이트'로 남도록 맨 뒤에 읽히게)
#  PROD_DOMAIN / TEST_DOMAIN / PROD_PORT / TEST_PORT 는 설치할 때 실제 값으로 바뀜

<VirtualHost *:80>
    ServerName PROD_DOMAIN
    ProxyPreserveHost On
    ProxyTimeout 200
    LimitRequestBody 41943040
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        / http://127.0.0.1:PROD_PORT/
    ProxyPassReverse / http://127.0.0.1:PROD_PORT/
    ErrorLog  logs/blog-prod-error.log
    CustomLog logs/blog-prod-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName TEST_DOMAIN
    ProxyPreserveHost On
    ProxyTimeout 200
    LimitRequestBody 41943040
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        / http://127.0.0.1:TEST_PORT/
    ProxyPassReverse / http://127.0.0.1:TEST_PORT/
    ErrorLog  logs/blog-test-error.log
    CustomLog logs/blog-test-access.log combined
</VirtualHost>
